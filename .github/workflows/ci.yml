name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build main
        run: gcc -Wall -Wextra -Werror -g src/main.c src/modbus.c -o frame

      - name: Build tests
        run: gcc -Wall -Wextra -Werror -g src/test_modbus.c src/modbus.c -o test

      - name: Run tests
        run: ./test
